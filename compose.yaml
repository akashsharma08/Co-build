services:
  postgres:
    image: postgres:17-alpine
    container_name: cobuild-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cobuild
      POSTGRES_USER: cobuild
      POSTGRES_PASSWORD: cobuild
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cobuild -d cobuild']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
